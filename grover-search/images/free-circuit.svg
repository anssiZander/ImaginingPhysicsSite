<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260" role="img" aria-labelledby="title"><title id="title">Free-box search circuit with a seven-T inverse wait</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081725"/><stop offset="1" stop-color="#0e1124"/></linearGradient><linearGradient id="phase"><stop stop-color="#66d9e9"/><stop offset=".25" stop-color="#ac79ee"/><stop offset=".5" stop-color="#ef7966"/><stop offset=".75" stop-color="#b5eb66"/><stop offset="1" stop-color="#66d9e9"/></linearGradient></defs><rect x="0" y="0" width="1100" height="260" fill="url(#bg)" /><g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="36" fill="#dceaf5" font-size="24" >All spatial mixing is forward in time.</text><path d="M25,115 L1070,115" stroke="#567f92" fill="none" /><rect x="35" y="76" width="110" height="74" fill="#132239" rx="7" stroke="#64d5d1"/><text x="90" y="122" fill="#64d5d1" font-size="25" text-anchor="middle">wait T</text><text x="90" y="179" fill="#9dbcd0" font-size="16" text-anchor="middle">prepare</text><rect x="185" y="76" width="110" height="74" fill="#132239" rx="7" stroke="#f38da3"/><text x="240" y="122" fill="#f38da3" font-size="25" text-anchor="middle">Ow</text><text x="240" y="179" fill="#9dbcd0" font-size="16" text-anchor="middle">phase pulse</text><rect x="329" y="76" width="385" height="74" fill="#132239" rx="7" stroke="#a8a3f1"/><text x="521.5" y="122" fill="#a8a3f1" font-size="25" text-anchor="middle">wait 7T</text><text x="521.5" y="179" fill="#9dbcd0" font-size="16" text-anchor="middle">A† = Ubox(7T)</text><rect x="748" y="76" width="110" height="74" fill="#132239" rx="7" stroke="#f38da3"/><text x="803" y="122" fill="#f38da3" font-size="25" text-anchor="middle">Sᵢ</text><text x="803" y="179" fill="#9dbcd0" font-size="16" text-anchor="middle">phase pulse</text><rect x="892" y="76" width="150" height="74" fill="#132239" rx="7" stroke="#64d5d1"/><text x="967" y="122" fill="#64d5d1" font-size="25" text-anchor="middle">wait T</text><text x="967" y="179" fill="#9dbcd0" font-size="16" text-anchor="middle">A = Ubox(T)</text><path d="M329,205 L1042,205" stroke="#8e92ca" fill="none" /><text x="489" y="237" fill="#bfc2ea" font-size="19" >Mₐ = A Sᵢ A† · repeat with the oracle</text></g></svg>