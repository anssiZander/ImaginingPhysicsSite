="102" width="40" height="36" fill="#123c42" rx="5" stroke="#5cbbb9"/><text x="215" y="127" fill="#d0fbf4" font-size="20" >H</text><rect x="202" y="261" width="40" height="36" fill="#123c42" rx="5" stroke="#5cbbb9"/><text x="215" y="286" fill="#d0fbf4" font-size="20" >H</text><rect x="202" y="430" width="40" height="36" fill="#123c42" rx="5" stroke="#5cbbb9"/><text x="215" y="455" fill="#d0fbf4" font-size="20" >H</text><text x="281" y="79" fill="#c5d9ee" font-size="21" >|0⟩</text><path d="M294,90 L294,560" stroke="#587d9a" fill="none" /><rect x="274" y="102" width="40" height="36" fill="#123c42" rx="5" stroke="#5cbbb9"/><text x="287" y="127" fill="#d0fbf4" font-size="20" >H</text><rect x="274" y="261" width="40" height="36" fill="#123c42" rx="5" stroke="#5cbbb9"/><text x="287" y="286" fill="#d0fbf4" font-size="20" >H</text><rect x="274" y="430" width="40" height="36" fill="#123c42" rx="5" stroke="#5cbbb9"/><text x="287" y="455" fill="#d0fbf4" font-size="20" >H</text><text x="26" y="163" fill="#90b8d0" font-size="16" >Prepare once; then repeat the bracket</text><rect x="53" y="186" width="265" height="48" fill="#182238" rx="7" stroke="#ff9aaf"/><text x="185" y="217" fill="#ff9aaf" font-size="21" text-anchor="middle">Oracle Ow</text><rect x="53" y="341" width="265" height="48" fill="#182238" rx="7" stroke="#d3b0ff"/><text x="185" y="372" fill="#d3b0ff" font-size="21" text-anchor="middle">Reference Sᵢ</text><path d="M342,183 L342,475" stroke="#b799e7" fill="none" /><path d="M331,183 L342,183" stroke="#b799e7" fill="none" /><path d="M331,475 L342,475" stroke="#b799e7" fill="none" /><rect x="53" y="521" width="265" height="48" fill="#2d2a1a" rx="7" stroke="#cfb471"/><text x="185" y="552" fill="#ffe19c" font-size="18" text-anchor="middle">Measure after three rounds</text><text x="28" y="612" fill="#b8cfe1" font-size="19" >Repeated: Ow → H → Sᵢ → H</text><text x="28" y="646" fill="#ceb4ee" font-size="20" >Mixer: M = H Sᵢ H = −D</text></g></svg>